name: KnownFix Store Checks
on: [push, pull_request, workflow_dispatch]
defaults:
  run:
    shell: powershell
jobs:
  store:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: MCP kit configuration tests
        run: node tests/mcp-kit.mjs
      - name: Installable toolkit and client setup contracts
        run: node tests/agent-toolkit.mjs
      - name: MCP response envelope and privacy tests
        run: node tests/mcp-response.mjs
      - name: Free skill and analytics boundaries
        run: node tests/free-skills.mjs
      - name: Paid webhook service catalog and checkout consistency
        run: node tests/webhook-service.mjs
      - name: SaaS security scope approval and catalog consistency
        run: node tests/saas-service.mjs
      - name: Retry timing, budget and local input privacy
        run: node tests/retry-planner.mjs
      - name: Service comparison and free tool discovery
        run: node tests/service-comparison.mjs
      - name: Companion guides and reproducible examples
        run: node tests/tool-guides.mjs
      - name: Owner analytics consent and data minimization
        run: node tests/analytics-property.mjs
      - name: Analytics consent lifecycle
        run: node tests/analytics-consent-lifecycle.mjs
      - name: Site-wide content and service metadata consistency
        run: node tests/site-quality.mjs
