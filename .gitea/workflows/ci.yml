name: KnownFix Store Checks
on: [push, pull_request, workflow_dispatch]
defaults:
  run:
    shell: powershell
jobs:
  store:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: MCP kit configuration tests
        run: node tests/mcp-kit.mjs
      - name: MCP response envelope and privacy tests
        run: node tests/mcp-response.mjs
      - name: Free skill and analytics boundaries
        run: node tests/free-skills.mjs
      - name: Paid webhook service catalog and checkout consistency
        run: node tests/webhook-service.mjs
